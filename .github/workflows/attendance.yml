name: greytHR sign-in

on:
  schedule:
    # Target: 05:00 IST. GitHub's scheduler is best-effort and has been seen to
    # drift by hours on busy runners, so we fire early and retry. attendance.js
    # is idempotent — a retry after a successful sign-in just reports
    # "already-signed-in" and does nothing.
    - cron: '30 23 * * 0-4'   # 23:30 UTC = 05:00 IST (Mon-Fri IST)
    - cron: '15 0 * * 1-5'    # 00:15 UTC = 05:45 IST (retry)
    - cron: '0 1 * * 1-5'     # 01:00 UTC = 06:30 IST (retry)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greythr-sign-in
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run sign-in
        id: signin
        env:
          GREYTHR_EMP_ID: ${{ secrets.GREYTHR_EMP_ID }}
          GREYTHR_PASSWORD: ${{ secrets.GREYTHR_PASSWORD }}
        run: node attendance.js

      - name: Notify via ntfy
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATUS: ${{ job.status }}
          RESULT: ${{ steps.signin.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "No NTFY_TOPIC secret set — skipping notification."
            exit 0
          fi

          case "$STATUS" in
            success)
              case "$RESULT" in
                signed-in)         TITLE="greytHR"; BODY="Your attendance has been marked for today at greytHR ✓"; TAGS="white_check_mark"; PRIORITY="default" ;;
                # Silent: these are the retry crons finding the work already
                # done, or a day off. Notifying would mean 3 pings every morning.
                already-signed-in|weekend|holiday)
                  echo "Result '$RESULT' — nothing to notify."; exit 0 ;;
                *)                 TITLE="greytHR"; BODY="Run finished ($RESULT)"; TAGS="white_check_mark"; PRIORITY="default" ;;
              esac
              ;;
            *)
              TITLE="greytHR FAILED"
              BODY="Attendance was NOT marked. Tap to view logs: $RUN_URL"
              TAGS="x,warning"
              PRIORITY="high"
              ;;
          esac

          curl -sS \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Priority: $PRIORITY" \
            -d "$BODY" \
            "https://ntfy.sh/$NTFY_TOPIC"

      # GitHub disables scheduled workflows after 60 days with no repository
      # activity — that is what silently killed this automation in Sept 2026.
      # Push a dated marker commit whenever the last commit is over 30 days old.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit is $age_days day(s) old."
          if [ "$age_days" -lt 30 ]; then
            echo "Recent enough — no keepalive commit needed."
            exit 0
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m 'chore: keepalive so the cron schedule stays enabled'
          git push origin "HEAD:${{ github.ref_name }}"
